<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <title>Minimal Timer</title>
    <link rel="stylesheet" href="minimal-clock.css">
    <script src="clock.js" defer></script>
</head>
<body>
<div class="top-bar">
    <h1 class="button">Back</h1>
    <h1 class="button">Options</h1>
</div>


<div class="main-container">
    <div class="clock">
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
        <div class="center-circle"></div>
        <div class="tick-mark" style="--i: 1;"></div>
        <div class="tick-mark" style="--i: 2;"></div>
        <div class="tick-mark" style="--i: 3;"></div>
        <div class="tick-mark" style="--i: 4;"></div>
    </div>
    <h1 class="title">Minimal Timer</h1>
</div>

</body>
