<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
        <html lang="en">
        <head>
        <meta charset="UTF-8">
        <title>Minimal Timer</title>
    <link rel="stylesheet" href="minimal-clock.css">
    <script src="clock.js" defer></script>
</head>
<body>
<div class="top-bar">
    <a class="button" href="../tools.html">Back</a>
    <h1 class="title">Minimal Clock</h1>
    <h1 class="button">Options</h1>
</div>


<div class="main-container">
    <div class="clock">
        <div class="hand hour-hand"></div>
        <div class="hand minute-hand"></div>
        <div class="hand second-hand"></div>
        <div class="center-circle"></div>
        <div class="tick-mark medium" style="--i: 1;"></div>
        <div class="tick-mark medium" style="--i: 2;"></div>
        <div class="tick-mark large" style="--i: 3;"></div>
        <div class="tick-mark medium" style="--i: 4;"></div>
        <div class="tick-mark medium" style="--i: 5;"></div>
        <div class="tick-mark large" style="--i: 6;"></div>
        <div class="tick-mark medium" style="--i: 7;"></div>
        <div class="tick-mark medium" style="--i: 8;"></div>
        <div class="tick-mark large" style="--i: 9;"></div>
        <div class="tick-mark medium" style="--i: 10;"></div>
        <div class="tick-mark medium" style="--i: 11;"></div>
        <div class="tick-mark large" style="--i: 12;"></div>
    </div>
    <p>Coming soon... calendar flippy paper thingy...</p>
</div>

</body>
